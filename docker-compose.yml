version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monolithic_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
      - JWT_SECRET=super-secure-production-grade-jwt-secret-key-min-32-chars-length
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=super-secure-production-grade-jwt-refresh-secret-min-32-chars
      - JWT_REFRESH_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
