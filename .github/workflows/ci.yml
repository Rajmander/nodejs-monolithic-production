name: CI & Policy Gates Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gate:
    name: Code Quality & Security Policy Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 - Code Formatting Style Check
        run: npm run format:check

      - name: Gate 2 - Static Code Analysis & Linting
        run: npm run lint

      - name: Gate 3 - Automated Test Suite & Coverage Thresholds
        run: npm run test:coverage

      - name: Gate 4 - Security Vulnerability Audit
        run: npm run audit:security --if-present
